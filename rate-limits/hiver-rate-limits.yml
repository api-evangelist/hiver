exhaustion:
  status: 429
  body: Too Many Requests
  guidance: Retry with exponential backoff.
  penalty: >-
    'Continuous retries with 429 error could result in the client-ip/api-key getting blacklisted.'
observability_gap: >-
  Hiver publishes NO rate-limit response headers - no RateLimit-Limit/Remaining/Reset, no
  X-RateLimit-*, no Retry-After. An agent cannot read its remaining budget or a server-supplied
  backoff hint; it can only discover the ceiling by hitting it. At 1 RPS this is the single
  most consequential runtime gap in the Hiver contract.
