security_txt:
  served: false
  note: >-
    No RFC 9116 security.txt on any Hiver host, even though Hiver runs a published vulnerability
    disclosure policy at https://hiverhq.com/disclosure with a security@hiverhq.com contact.
    Publishing a security.txt pointing at that page is a one-file fix.
agent_card:
  found: false
  note: >-
    Probed /.well-known/agent-card.json and the legacy /.well-known/agent.json on all five
    hosts. Every 200 was an SPA HTML shell; no JSON object with AgentCard shape exists.
    No a2a/ artifact was written.
