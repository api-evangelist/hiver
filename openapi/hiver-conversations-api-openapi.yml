                        assignee_id: 1028399
                      status: open
                      tag_ids: []
                      gmail_thread_id: 19cfee91188070f8
                      private_permalink: https://v2.hiverhq.com/permalinks/pvt/201c00fa
                      public_permalink: https://v2.hiverhq.com/permalinks/pub/42a83f80581842e683c0f827a090cdca40c1334f
                      message_ids:
                      - hiver_message_id: 834466048
                        gmail_message_id: 19cfee91188070f8
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: ''
                          example: '538706170'
                        assignee:
                          type: object
                          description: ''
                          example:
                            assignee_type: user
                            assignee_id: 1028399
                          properties:
                            assignee_type:
                              type: string
