  /inboxes/{inbox_id}/conversations/{conversation_id}:
    get:
      tags:
      - Conversations
      summary: Get a conversation in the inbox
      description: "Get a conversation in the inbox\n\n**Note:**\n\n*   The `conversation_id` field accepts either **Hiver conversation ID** or **Gmail thread ID**.\n    \n*   The Gmail Thread ID and Message IDs returned in the response are scoped to the **user authenticated with the shared mailbox email address (the source user)**. These IDs can be used directly in other Hiver APIs that require Gmail identifiers."
      operationId: Conversations_conversations/get-a-conversation-in-the-inbox
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          type: string
          example: '343'
          description: ID of the inbox to get the user list for
          default: ''
        description: ID of the inbox to get the user list for
        example: '343'
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          example: '343'
          description: Unique identifier of the conversation, which can be either a Hiver Conversation ID or a Gmail Thread ID
          default: ''
        description: Unique identifier of the conversation, which can be either a Hiver Conversation ID or a Gmail Thread ID
        example: '343'
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
          example: Bearer {token}
          description: ''
          default: ''
        description: ''
        example: Bearer {token}
      responses:
