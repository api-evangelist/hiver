summary: >-
  Hiver publishes NO client SDK for its REST API in any language. The developer portal documents
  the API with raw curl only, and neither github.com/GrexIt (Hiver's verified GitHub org, one
  public repo: a 2019 fork of react-native-google-signin) nor github.com/Hiverhq (zero public
  repos) carries a client library. The npm packages below ARE published by Hiver staff accounts
  but are internal engineering tooling - a design system, Claude Code skills, connector app
  shells - not API clients.
sdk_gap: >-
  A consumer integrating the Hiver API today hand-rolls the Bearer header, the `data` envelope,
  the opaque `next_page` cursor and 429 backoff. There is no first-party client to depreciate,
  and no community client on npm or PyPI that wraps api2.hiverhq.com.
