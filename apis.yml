aid: hiver
name: Hiver
description: >-
  Hiver (Hiver Inc., originally GrexIt) builds an AI-powered customer service platform for teams
  that run support out of shared email addresses. It ships in two forms: Hiver in Gmail, a
  Chrome-extension helpdesk that turns shared inboxes like support@ and billing@ into assignable,
  SLA-tracked queues without leaving Gmail; and Hiver Omni, a standalone omnichannel platform
  covering email, live chat, Slack, voice, WhatsApp, a help center and a customer portal. Hiver
  publishes a public REST API for Shared Inboxes, conversations, users, tags and internal notes,
  documented on a Theneo developer portal with a downloadable OpenAPI 3.0.2 contract, and gates
  API access to its Pro plan and above.
